[project]
name = "meeting-notes-extractive-corpus"
version = "1.0.0"
description = "Builds meeting-notes-extractive-v1: sentence-labelled meeting transcripts (importance + zone)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA"]
dependencies = [
    "lxml>=5.2",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
publish = [
    "huggingface_hub>=0.24",
    "kaggle>=1.6",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # en dashes, ×, … are intended in a text corpus

[tool.ruff.lint.per-file-ignores]
# The dataset-card template holds Markdown tables that cannot be wrapped.
"processing/export_parquet.py" = ["E501"]
# Inline NXT XML fixtures.
"tests/test_relabel_ami.py" = ["E501"]
